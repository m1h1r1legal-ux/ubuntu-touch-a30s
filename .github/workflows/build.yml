name: Build Ubuntu Touch for Galaxy A30s 

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3 

    - name: Freeing Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc 

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y git repo gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip bc openjdk-8-jdk 

    - name: Initialize Halium Repo
      run: |
        mkdir halium && cd halium
        git config --global user.name "Your Name"
        git config --global user.email "yourmail@example.com"
        repo init -u https://github.com -b halium-9.0 --depth=1 

    - name: Clone Galaxy A30s Source Code
      run: |
        cd halium
        git clone https://github.com -b lineage-16.0 device/samsung/exynos7885
        git clone https://github.com -b lineage-16.0 kernel/samsung/exynos7885
        git clone https://github.com -b lineage-16.0 hardware/samsung 

    - name: Run Repository Sync
      run: |
        cd halium
        repo sync -c -j$(nproc) --no-clone-bundle --no-tags 

    - name: Build Halium Boot and System Image
      run: |
        cd halium
        source build/envsetup.sh
        lunch halium_a30s-userdebug || lunch halium_exynos7885-userdebug
        make halium-boot -j$(nproc)
        make systemimage -j$(nproc) 

    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: Ubuntu-Touch-Galaxy-A30s
        path: |
          halium/out/target/product/*/halium-boot.img
          halium/out/target/product/*/system.img
